<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Certifications · TPPF Clinic</title>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="shell-root"></div>
    <div class="main" id="main-root">
      <main class="content" id="page-content">

        <div class="page-toolbar">
          <div class="toolbar-filters">
            <div class="search-box">
              <span id="search-icon-slot"></span>
              <input type="text" id="search-input" placeholder="Search by candidate name or code…" />
            </div>
            <select class="select-filter" id="result-filter">
              <option value="all">All results</option>
              <option value="fit">Fit</option>
              <option value="unfit">Unfit</option>
            </select>
          </div>
          <button class="btn btn-primary" id="new-cert-btn">
            <span id="plus-icon-slot"></span> Record Certification
          </button>
        </div>

        <div id="certs-table-region"></div>

      </main>
    </div>
  </div>

  <!-- Record Certification Modal (candidate picker + exam form) -->
  <div class="modal-backdrop" id="cert-modal-backdrop">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div>
          <h2>Record Certification Exam</h2>
          <p>Pre-employment medical exam result for a registered candidate.</p>
        </div>
        <button class="icon-btn" id="cert-modal-close"></button>
      </div>
      <form id="cert-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field span-2">
              <label for="cf-registration">Candidate</label>
              <select id="cf-registration" required></select>
              <div class="hint" id="cf-registration-hint"></div>
            </div>
            <div class="field span-2">
              <label for="cf-physician">Examining physician</label>
              <select id="cf-physician" required></select>
            </div>
            <div class="field">
              <label for="cf-physical">Physical examination</label>
              <select id="cf-physical"><option value="normal">Normal</option><option value="abnormal">Abnormal</option></select>
            </div>
            <div class="field">
              <label for="cf-hygiene">Personal hygiene</label>
              <select id="cf-hygiene"><option value="good">Good</option><option value="fair">Fair</option><option value="poor">Poor</option></select>
            </div>
            <div class="field">
              <label for="cf-skin">Skin disease</label>
              <select id="cf-skin"><option value="none">None</option><option value="present">Present</option></select>
            </div>
            <div class="field">
              <label for="cf-stool">Stool exam (direct)</label>
              <select id="cf-stool"><option value="negative">Negative</option><option value="positive">Positive</option></select>
            </div>
            <div class="field">
              <label for="cf-syphilis">Syphilis</label>
              <select id="cf-syphilis"><option value="negative">Negative</option><option value="positive">Positive</option></select>
            </div>
            <div class="field">
              <label for="cf-gonorrhea">Gonorrhea</label>
              <select id="cf-gonorrhea"><option value="negative">Negative</option><option value="positive">Positive</option></select>
            </div>
            <div class="field span-2">
              <label for="cf-other">Other findings</label>
              <textarea id="cf-other" rows="2"></textarea>
            </div>
            <div class="field span-2">
              <label for="cf-result">Result</label>
              <select id="cf-result" required>
                <option value="">Select…</option>
                <option value="fit">Fit</option>
                <option value="unfit">Unfit</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="cf-treatment">Treatment note (if unfit)</label>
              <textarea id="cf-treatment" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cert-form-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="cert-form-submit">Save Exam Result</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Certification Detail Modal -->
  <div class="modal-backdrop" id="cert-detail-backdrop">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="cd-name"></h2>
          <p id="cd-sub"></p>
        </div>
        <button class="icon-btn" id="cert-detail-close"></button>
      </div>
      <div class="modal-body" id="cert-detail-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cd-view-candidate">View Candidate</button>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/certifications.js"></script>
</body>
</html>
