<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports · TPPF Clinic</title>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div id="shell-root"></div>
    <div class="main" id="main-root">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:20px;">
          <div>
            <h2 style="margin:0; font-size:20px; font-weight:700; color:var(--color-text-heading, #0A4F49);">Executive Summary &amp; Analytics</h2>
            <p class="text-muted" style="margin:4px 0 0 0; font-size:13px;">View operational metrics or export comprehensive clinic summary data.</p>
          </div>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn btn-primary" id="export-excel-btn">
              <span id="export-btn-icon"></span> Export to Excel (.csv)
            </button>
          </div>
        </div>

        <div class="stat-grid" id="overview-stats"></div>

        <div class="panel-grid">
          <div class="panel">
            <div class="panel-header">
              <h3>Pre-employment outcomes</h3>
              <span class="panel-meta">By registration status</span>
            </div>
            <div id="registration-breakdown"></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h3>Certification results</h3>
              <span class="panel-meta">Fit vs. unfit</span>
            </div>
            <div id="certification-breakdown"></div>
          </div>
        </div>

        <div class="panel-grid">
          <div class="panel">
            <div class="panel-header">
              <h3>Visit dispositions</h3>
              <span class="panel-meta">Closed visits only</span>
            </div>
            <div id="disposition-breakdown"></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h3>Lab order activity</h3>
              <span class="panel-meta">By status</span>
            </div>
            <div id="lab-breakdown"></div>
          </div>
        </div>

        <div class="panel" style="margin-bottom:24px;">
          <div class="panel-header">
            <h3>Drugs below reorder threshold</h3>
            <span class="panel-meta" id="low-stock-count"></span>
          </div>
          <div id="low-stock-region"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
