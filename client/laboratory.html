<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Laboratory · TPPF Clinic</title>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  /* ── Lab order form tabs ── */
  .lab-tabs {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--color-border-strong);
    margin-bottom: 0;
    flex-wrap: wrap;
  }
  .lab-tab-btn {
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--color-bg);
    border: 1.5px solid var(--color-border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    color: var(--color-text-muted);
    transition: background .15s, color .15s;
    margin-right: 3px;
    margin-bottom: -2px;
  }
  .lab-tab-btn.active {
    background: var(--color-surface);
    color: var(--color-primary);
    border-color: var(--color-border-strong);
    border-bottom: 2px solid var(--color-surface);
    position: relative;
    z-index: 1;
  }
  .lab-tab-btn:hover:not(.active) {
    background: var(--color-primary-light);
    color: var(--color-primary);
  }
  .lab-tab-panel {
    display: none;
    padding: 16px;
    background: var(--color-surface);
    border: 1.5px solid var(--color-border-strong);
    border-top: none;
    border-radius: 0 0 10px 10px;
  }
  .lab-tab-panel.active { display: block; }

  /* ── Test grid within a panel ── */
  .lab-panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 0 28px;
  }
  .lab-panel-section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--color-primary);
    margin: 10px 0 8px;
    grid-column: 1 / -1;
  }
  .lab-test-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 4px;
    border-radius: 6px;
    transition: background .1s;
  }
  .lab-test-row:hover { background: var(--color-primary-light); }
  .lab-test-row input[type="checkbox"] {
    width: 15px; height: 15px; flex-shrink: 0;
    accent-color: var(--color-primary);
    cursor: pointer;
  }
  .lab-test-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
    min-width: 110px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .lab-test-range {
    font-size: 11px;
    color: var(--color-primary);
    font-style: italic;
    margin-left: auto;
    white-space: nowrap;
  }

  /* ── Result input inside detail modal ── */
  .lab-result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px 24px;
  }
  .lab-result-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--color-bg);
    border-radius: 8px;
    border: 1px solid var(--color-border);
  }
  .lab-result-item .lab-result-label {
    font-size: 12px;
    font-weight: 700;
    min-width: 100px;
    flex-shrink: 0;
  }
  .lab-result-item .lab-result-range {
    font-size: 11px;
    color: var(--color-primary);
    font-style: italic;
    flex-shrink: 0;
  }
  .lab-result-item input[type="text"] {
    flex: 1;
    min-width: 70px;
    border: 1px solid var(--color-border-strong);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    background: var(--color-surface);
    color: var(--color-text);
  }
  .lab-result-section-head {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--color-primary);
    padding: 10px 0 4px;
    border-bottom: 1px solid var(--color-border);
    margin-bottom: 6px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
  <div class="app-shell">
    <div id="shell-root"></div>
    <div class="main" id="main-root">
      <main class="content" id="page-content">

        <div class="page-toolbar">
          <div class="toolbar-filters">
            <div class="search-box">
              <span id="search-icon-slot"></span>
              <input type="text" id="search-input" placeholder="Search by patient name or code…" />
            </div>
            <select class="select-filter" id="status-filter">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <button class="btn btn-primary" id="new-order-btn">
            <span id="plus-icon-slot"></span> New Lab Order
          </button>
        </div>

        <div id="orders-table-region"></div>

      </main>
    </div>
  </div>

  <!-- New Lab Order Modal -->
  <div class="modal-backdrop" id="order-modal-backdrop">
    <div class="modal modal-wide" style="max-width:900px;">
      <div class="modal-header">
        <div>
          <h2>New Lab Order</h2>
          <p>Select the visit, physician, and the tests to order.</p>
        </div>
        <button class="icon-btn" id="order-modal-close"></button>
      </div>
      <form id="order-form">
        <div class="modal-body" style="display:flex; flex-direction:column; gap:16px;">

          <!-- Visit & physician selectors -->
          <div class="form-grid" style="margin-bottom:0;">
            <div class="field">
              <label for="of-visit">Visit</label>
              <select id="of-visit" required></select>
              <div class="hint">Only visits that aren't closed yet are eligible.</div>
            </div>
            <div class="field">
              <label for="of-physician">Ordering physician</label>
              <select id="of-physician" required></select>
            </div>
          </div>

          <!-- Tabbed test selector -->
          <div>
            <label style="font-size:13px; font-weight:600; margin-bottom:8px; display:block;">Tests</label>

            <div class="lab-tabs" id="lab-tabs-nav">
              <button type="button" class="lab-tab-btn active" data-tab="Hematology">Hematology</button>
              <button type="button" class="lab-tab-btn" data-tab="Parasitology|Urinalysis">Parasitology | Urinalysis</button>
              <button type="button" class="lab-tab-btn" data-tab="Sed|Bacteriology|Other">Sed | Bacteriology | Other</button>
              <button type="button" class="lab-tab-btn" data-tab="Chemistry">Chemistry</button>
            </div>

            <!-- Hematology -->
            <div class="lab-tab-panel active" id="tab-panel-Hematology">
              <div class="lab-panel-grid" id="lab-tests-Hematology"></div>
            </div>

            <!-- Parasitology | Urinalysis -->
            <div class="lab-tab-panel" id="tab-panel-Parasitology|Urinalysis">
              <div class="lab-panel-grid" id="lab-tests-ParasitologyUrinalysis"></div>
            </div>

            <!-- Sed | Bacteriology | Other Body Fluids -->
            <div class="lab-tab-panel" id="tab-panel-Sed|Bacteriology|Other">
              <div class="lab-panel-grid" id="lab-tests-SedBacteriologyOther"></div>
            </div>

            <!-- Chemistry -->
            <div class="lab-tab-panel" id="tab-panel-Chemistry">
              <div class="lab-panel-grid" id="lab-tests-Chemistry"></div>
            </div>

          </div>

          <div id="order-selected-summary" style="font-size:12px; color:var(--color-text-muted); min-height:18px;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="order-form-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="order-form-submit">Create Order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div class="modal-backdrop" id="order-detail-backdrop">
    <div class="modal modal-wide" style="max-width:860px;">
      <div class="modal-header">
        <div>
          <h2 id="od-name"></h2>
          <p id="od-sub"></p>
        </div>
        <button class="icon-btn" id="order-detail-close"></button>
      </div>
      <div class="modal-body" id="order-detail-body"></div>
      <div class="modal-footer" id="order-detail-footer"></div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/laboratory.js"></script>
</body>
</html>
